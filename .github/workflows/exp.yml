---
name: exp cancel semantics
on:
  push:
    branches: [exp-cancel-semantics]
permissions:
  contents: read
jobs:
  # A: the structure of the PR now: outer always(), inner always() && !cancelled() + fallback
  a-inner-split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: A collect
        if: always()
        uses: ./.github/actions/exp-normal
      - name: A teardown
        if: always()
        run: echo "teardown ran $(date +%T)"
  # B: the split at workflow level: outer always() && !cancelled(), then a fallback outer step
  b-outer-split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: B collect
        id: b1
        if: always() && !cancelled()
        uses: ./.github/actions/exp-sleep
      - name: B collect (cancelled)
        if: cancelled() && (steps.b1.outcome == 'skipped' || steps.b1.outcome == 'cancelled')
        uses: ./.github/actions/exp-sleep
        with:
          seconds: "3"
      - name: B teardown
        if: always()
        run: echo "teardown ran $(date +%T)"
  # C: the real upload with the exact path block of upload-artifacts (normal run, no cancel)
  c-upload:
    runs-on: ubuntu-latest
    steps:
      - name: prepare files incl. the hidden marker
        run: |
          mkdir -p "${RUNNER_TEMP}/osac-artifacts/sub"
          echo log > "${RUNNER_TEMP}/osac-artifacts/a.log"
          echo log > "${RUNNER_TEMP}/osac-artifacts/sub/b.log"
          : > "${RUNNER_TEMP}/osac-artifacts/.redaction-complete"
          ls -la "${RUNNER_TEMP}/osac-artifacts"
      - name: upload
        if: always() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: exp-artifact
          path: |
            ${{ runner.temp }}/osac-artifacts/
            !${{ runner.temp }}/osac-artifacts/.redaction-complete
          retention-days: 1
          if-no-files-found: error
